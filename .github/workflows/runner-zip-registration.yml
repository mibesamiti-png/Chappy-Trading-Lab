name: Runner ZIP registration
on:
  push:
    branches: [chat/runner-zip-registration-20261128, chat/runner-zip-diagnostics-20261128, chat/runner-zip-research-probe-20261128, chat/runner-parquet-probe-20261128, chat/runner-market-catalog-20261128, chat/runner-market-selection-20261128, chat/runner-auto-selection-20261128, chat/runner-plan-resume-20261128, chat/runner-synthetic-execution-20261128, chat/runner-existing-index-20261128, chat/runner-index-column-map-20261128, chat/runner-monthly-quality-20261128, chat/runner-auto-diagnostics-20261128, chat/runner-update-probe-20261128, chat/runner-session-aggregation-20261128, chat/runner-session-mapping-20261128, chat/runner-calendar-index-20261128, chat/runner-descriptive-statistics-20261128, chat/runner-integrated-pipeline-20261128, chat/runner-source-admission-20261128, chat/runner-footer-layout-20261128, chat/runner-prefix-candidate-20261128, chat/runner-real-footer-20261128, chat/runner-batch-adapter-20261128, chat/runner-session-connection-20261128, chat/runner-control-plane-20261128, chat/runner-dual-guard-20261128, chat/runner-guarded-resume-20261128]
  pull_request:
    branches: [chat/runner-source-releases-20261128]
    paths:
      - 'operations/runner_dist/START_GUI.pyw'
      - 'tests/test_runner_zip_registration.py'
      - 'tests/test_runner_zip_probe.py'
      - 'tests/test_runner_zip_catalog.py'
      - 'tests/test_runner_zip_existing_index.py'
      - 'tests/test_runner_zip_monthly_quality.py'
      - 'tests/test_runner_zip_auto_diagnostics.py'
      - 'tests/test_runner_zip_control_plane.py'
      - 'tests/test_runner_zip_dual_guard.py'
      - 'tests/test_runner_zip_update_probe.py'
      - 'tests/test_runner_zip_session_aggregation.py'
      - 'tests/test_runner_zip_session_mapping.py'
      - 'tests/test_runner_zip_calendar_index.py'
      - 'tests/test_runner_zip_descriptive_statistics.py'
      - 'tests/test_runner_zip_source_admission.py'
      - 'tests/test_runner_layout.py'
      - 'tests/test_runner_market_selection.py'
      - 'tests/test_runner_parquet_probe.py'
      - '.github/workflows/runner-zip-registration.yml'
      - 'operations/runner_release.json'
      - 'operations/runner_dist/app_version.py'
permissions:
  contents: read
jobs:
  synthetic-registration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile GUI and run synthetic registration tests
        run: |
          python -m py_compile operations/runner_dist/START_GUI.pyw
          python -m unittest discover -s tests -p 'test_runner_zip_*.py' -v
      - name: Install isolated PyArrow and run actual artificial Parquet checks
        run: python -m unittest discover -s tests -p test_runner_parquet_probe.py -v
      - name: Exercise selection and artificial OHLCV audit
        run: python -m unittest discover -s tests -p test_runner_market_selection.py -v
      - name: Verify release manifest for changed files
        run: python tests/verify_runner_zip_manifest.py
      - name: Verify real Tk footer geometry (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p test_runner_layout.py -v
      - name: Verify real Tk footer geometry (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -p test_runner_layout.py -v
